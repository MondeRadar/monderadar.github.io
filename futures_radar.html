<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>孟德雷達｜期貨雷達</title>
<style>
:root{--bg:#0b1220;--card:#121c2e;--line:#2d405d;--text:#e7edf7;--muted:#a8b7cc;--gold:#f6c453;--green:#55d6a5;--red:#ff8a8a;--blue:#62b0ff;--orange:#ff9f68;--daily:#9db7ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,'Noto Sans TC',sans-serif}main{max-width:1180px;margin:auto;padding:28px 18px 42px}h1,h2{margin:0 0 10px;color:var(--gold)}h1{font-size:clamp(28px,5vw,48px)}p{margin:7px 0;color:var(--muted)}.hero,.card,.panel{border:1px solid var(--line);border-radius:18px;background:var(--card);padding:22px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.kv,.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;margin-top:14px}.label,.muted{color:var(--muted)}.value{text-align:right;overflow-wrap:anywhere}.badge{display:inline-block;border-radius:999px;padding:6px 12px;background:#1f334c;color:var(--green);font-weight:700}.warn{color:var(--gold)}.error{padding:16px;border-radius:12px;background:#281d25;color:var(--red);border:1px solid #864b5a}.loading{padding:16px;border-radius:12px;background:#18253a}details{color:var(--muted)}summary{cursor:pointer;color:var(--gold)}button{border:1px solid var(--line);border-radius:8px;background:#1f334c;color:var(--text);padding:8px 12px;cursor:pointer}.market-layout{display:grid;grid-template-columns:minmax(0,2fr) minmax(300px,1fr);gap:16px}.chart-box{position:relative;min-height:520px;border:1px solid var(--line);border-radius:14px;padding:10px;background:#0e1829;overflow:hidden}.chart-title{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:14px;margin-bottom:8px}.chart{width:100%;height:auto;min-height:420px;display:block}.chart text{font-size:12px;fill:var(--text)}.axis-label{fill:var(--muted)!important;font-size:11px!important}.grid-line{stroke:#29405f;stroke-width:1;stroke-dasharray:2 4}.metric{border:1px solid var(--line);border-radius:12px;padding:12px}.metric small{display:block;color:var(--muted)}.metric strong{display:block;font-size:20px;margin-top:6px}.legend{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-top:8px}.legend span{white-space:nowrap}.source-note{font-size:12px}.source-role{color:var(--blue)}.out-of-range{margin-top:10px;padding:9px 11px;border-left:3px solid var(--gold);background:#201c14;color:var(--gold);font-size:13px}.chart-status{margin-top:10px}footer{margin-top:26px;color:var(--muted);font-size:13px}@media(max-width:760px){main{padding:18px 12px 30px}.grid,.market-layout{grid-template-columns:1fr}.kv{grid-template-columns:1fr 1fr}.value{text-align:left}.chart-box{min-height:390px;padding:6px}.chart{min-height:330px}.metric-grid{grid-template-columns:1fr 1fr}.metric strong{font-size:17px}}@media(max-width:390px){.kv,.metric-grid{grid-template-columns:1fr}.chart-title{font-size:12px}}
</style></head><body><main>
<section class="hero"><h1>孟德雷達</h1><p>Futures Radar｜期貨雷達</p><p id="radar-date">資料載入中</p><span id="readiness" class="badge">載入中</span><p id="pair-warning" class="warn"></p></section>
<div id="app"><div class="loading">正在讀取正式 Futures Radar 資料…</div></div>
<section class="panel"><h2>資料驗證</h2><details><summary>展開驗證詳情</summary><pre id="integrity"></pre></details></section>
<footer>資料僅供市場研究與資訊整理，不構成投資建議。期貨具高槓桿與高風險，交易前請自行評估風險承受能力。</footer></main>
<script>
const presentationSource='./futures_radar_presentation.json',chartSource='./futures_radar_chart_data.json';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number.isFinite(Number(n))?Number(n).toLocaleString('en-US',{maximumFractionDigits:2}):'N/A';
const field=(l,v)=>`<div class="label">${esc(l)}</div><div class="value">${esc(v??'資料累積中')}</div>`;
const friendly=v=>({REVIEW_PENDING_VALIDLY:'驗證待完成',REVIEW_AMBIGUOUS:'盤中路徑待確認',NOT_TRIGGERED:'未觸發',NO_TRADE:'未交易'}[v]||v||'資料累積中');
function nums(v){return(String(v??'').match(/[\d,]+(?:\.\d+)?/g)||[]).map(x=>Number(x.replace(/,/g,''))).filter(Number.isFinite)}
function range(v){const a=nums(v);return a.length?{low:Math.min(...a),high:Math.max(...a)}:null}
function validBars(m){return m&&Array.isArray(m.bars)&&m.bars.length>0&&m.bars.every(b=>[b.open,b.high,b.low,b.close].every(Number.isFinite)&&b.high>=Math.max(b.open,b.close)&&b.low<=Math.min(b.open,b.close)&&b.high>=b.low&&Date.parse(b.timestamp))}
function localRange(m){const b=m.bars,o=m.overlays||{},values=b.flatMap(x=>[x.low,x.high]);const zones=[o.hourly_support,o.hourly_resistance,o.daily_support,o.daily_resistance].map(range).filter(Boolean);values.push(...[o.entry,o.stop,o.target].filter(Number.isFinite));zones.forEach(z=>values.push(z.low,z.high));return {low:Math.min(...values),high:Math.max(...values),barLow:Math.min(...b.map(x=>x.low)),barHigh:Math.max(...b.map(x=>x.high))}}
function levelState(z,lo,hi,barLow,barHigh){if(!z)return null;const span=barHigh-barLow||1;return z.high>=lo&&z.low<=hi&&z.high>=barLow-span*1.5&&z.low<=barHigh+span*1.5?'IN_RANGE':'OUT_OF_RANGE'}
function renderChart(m){const b=m.bars,o=m.overlays||{},W=980,H=480,p={l:64,r:116,t:24,b:62},lr=localRange(m),barSpan=lr.barHigh-lr.barLow||1,domainPad=Math.max(barSpan*.08,1),lo=lr.low-domainPad,hi=lr.high+domainPad,span=hi-lo||1,y=v=>p.t+(hi-v)/span*(H-p.t-p.b),x=i=>p.l+i/(Math.max(1,b.length-1))*(W-p.l-p.r),ticks=5;let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(m.market||'')} 60m candlestick chart">`;
for(let i=0;i<=ticks;i++){const v=lo+(hi-lo)*i/ticks,yy=y(v);s+=`<line class="grid-line" x1="${p.l}" y1="${yy}" x2="${W-p.r}" y2="${yy}"/><text class="axis-label" x="${p.l-8}" y="${yy+4}" text-anchor="end">${fmt(v)}</text>`}
const labelEvery=Math.max(1,Math.ceil(b.length/6));b.forEach((v,i)=>{const xx=x(i),w=Math.max(3,(W-p.l-p.r)/b.length*.62),up=v.close>=v.open,c=up?'#55d6a5':'#ff8a8a';s+=`<g><title>${esc(`${v.timestamp} O ${v.open} H ${v.high} L ${v.low} C ${v.close}`)}</title><line x1="${xx}" y1="${y(v.high)}" x2="${xx}" y2="${y(v.low)}" stroke="${c}"/><rect x="${xx-w/2}" y="${y(Math.max(v.open,v.close))}" width="${w}" height="${Math.max(1,Math.abs(y(v.open)-y(v.close)))}" fill="${c}"/>`;if(i%labelEvery===0||i===b.length-1)s+=`<text class="axis-label" x="${xx}" y="${H-p.b+18}" text-anchor="middle">${esc(v.timestamp.slice(5,16).replace('T',' '))}</text>`;s+='</g>'});
const levels=[['Entry',o.entry,'#f6c453','',2],['Stop',o.stop,'#ff8a8a','6 4',2],['Target',o.target,'#55d6a5','',2]];const zones=[['60m S',range(o.hourly_support),'#62b0ff',.18],['60m R',range(o.hourly_resistance),'#ff9f68',.18],['Daily S',range(o.daily_support),'#9db7ff',.12],['Daily R',range(o.daily_resistance),'#ffb38a',.12]];const statuses=[];
zones.forEach(([label,z,color,opacity])=>{const state=levelState(z,lo,hi,lr.barLow,lr.barHigh);statuses.push({label,state});if(state==='IN_RANGE'){const top=y(z.high),bottom=y(z.low);s+=`<rect x="${p.l}" y="${Math.min(top,bottom)}" width="${W-p.l-p.r}" height="${Math.max(2,Math.abs(bottom-top))}" fill="${color}" opacity="${opacity}"/><line x1="${p.l}" y1="${top}" x2="${W-p.r}" y2="${top}" stroke="${color}" stroke-dasharray="4 3"/><line x1="${p.l}" y1="${bottom}" x2="${W-p.r}" y2="${bottom}" stroke="${color}" stroke-dasharray="4 3"/><text x="${W-p.r+6}" y="${top+12}" class="axis-label">${label} ${fmt(z.high)}</text>`}});
levels.forEach(([label,v,color,dash,width])=>{if(Number.isFinite(v)){const yy=y(v);s+=`<line x1="${p.l}" y1="${yy}" x2="${W-p.r}" y2="${yy}" stroke="${color}" stroke-width="${width}" ${dash?`stroke-dasharray="${dash}"`:''}/><text x="${W-p.r+6}" y="${yy+4}" class="axis-label">${label} ${fmt(v)}</text>`}});s+=`<text class="axis-label" x="${W/2}" y="${H-8}" text-anchor="middle">時間（Asia/Taipei）</text></svg>`;return {svg:s,statuses}}
function levelText(label,v){const r=range(v);return r?`${label} ${fmt(r.low)}${r.low!==r.high?`–${fmt(r.high)}`:''}`:`${label} ${v||'—'}`}
function chartCard(key,m){if(!validBars(m))return `<section class="card"><h2>${esc(key)}｜技術線圖</h2><div class="error">技術線圖資料格式無效，已安全停止顯示。</div></section>`;const last=m.bars[m.bars.length-1].close,src=m.source_metadata||{},chart=renderChart(m),oor=chart.statuses.filter(x=>x.state==='OUT_OF_RANGE');return `<section class="card"><h2>${esc(key==='TXF'?'台指期 TXF':'E-mini S&P 500 ES')}｜60m 技術線圖</h2><p class="muted">資料日期：${esc(m.chart_source_date)}｜資料已更新</p><div class="market-layout"><div class="chart-box"><div class="chart-title"><span>60m Candlestick｜X 軸時間・Y 軸點數</span><span>Last ${fmt(last)}</span></div>${chart.svg}<div class="legend"><span>■ Entry</span><span>┄ Stop</span><span>■ Target</span><span>▱ 60m 支撐／壓力</span><span>▱ 日線支撐／壓力</span></div>${oor.map(x=>`<div class="out-of-range">${esc(x.label)}：OUT_OF_RANGE，未繪入主圖，請以右側正式區間為準。</div>`).join('')}</div><div><div class="metric-grid">${[['Last',last],['Entry',m.overlays.entry],['Stop',m.overlays.stop],['Target',m.overlays.target]].map(([l,v])=>`<div class="metric"><small>${l}</small><strong>${esc(fmt(v))}</strong></div>`).join('')}</div><div class="kv">${field('60m 支撐',levelText('',m.overlays.hourly_support))}${field('60m 壓力',levelText('',m.overlays.hourly_resistance))}${field('日線支撐',levelText('',m.overlays.daily_support))}${field('日線壓力',levelText('',m.overlays.daily_resistance))}</div><p class="source-note ${key==='ES'?'source-role':''}">${esc(src.source||'圖表來源')}｜${key==='ES'?'ES=F continuous contract｜僅供圖表呈現':'TAIFEX official'}</p><p class="chart-status">Review：${esc(friendly(m.review_status))}</p></div></div></section>`}
function card(c){c=c||{};return `<section class="card"><h2>${esc(c.display_name||'期貨市場')}</h2><p>${c.is_current?'當前正式 R1':'本日無有效新 R1'}｜資料日期：${esc(c.business_date||'—')}</p>${c.is_current?`<div class="kv">${field('Prediction ID',c.prediction_id)}${field('方向',c.direction)}${field('狀態',c.strategy_status)}${field('Entry',c.entry)}${field('Stop',c.stop)}${field('Target',c.target)}${field('RR',c.rr)}${field('Review',friendly(c.review_status))}</div>`:'<p class="warn">本日無有效新 R1，未使用舊訊號補位。</p>'}<details><summary>Debug / provenance</summary><pre>${esc(JSON.stringify({prediction_id:c.prediction_id,snapshot_hash:c.snapshot_hash,scheduler_evidence:c.scheduler_evidence},null,2))}</pre></details></section>`}
async function getJson(url){const c=new AbortController(),t=setTimeout(()=>c.abort(),10000);try{const r=await fetch(url,{signal:c.signal,cache:'no-cache'});if(!r.ok)throw Error('HTTP '+r.status);return await r.json()}finally{clearTimeout(t)}}
function verify(p,c){if(c.radar_date!==p.radar_date||c.presentation_hash!==p.presentation_hash)throw Error('圖表與雷達版本不一致');for(const k of ['TXF','ES']){if(!c.markets?.[k]||c.markets[k].prediction_id!==p.markets[k].prediction_id||c.markets[k].snapshot_hash!==p.markets[k].snapshot_hash)throw Error(`${k} 圖表 binding 不一致`);if(c.markets[k].freshness!=='CURRENT_FOR_RADAR_DATE')throw Error(`${k} 圖表資料不是當前 Radar 日期`)}}
async function load(){try{const p=await getJson(presentationSource);if(!p?.radar_date||!p.markets?.TXF||!p.markets?.ES)throw Error('正式資料 schema 不完整');document.getElementById('radar-date').textContent='Radar date：'+p.radar_date+'｜最後更新：'+(p.generated_at||'—');document.getElementById('readiness').textContent=p.release_readiness||'READY';document.getElementById('pair-warning').textContent=p.pairing?.warning||'';const sh=p.forward_shadow||{};document.getElementById('app').innerHTML='<div class="grid">'+['TXF','ES'].map(m=>card(p.markets[m])).join('')+'</div><section class="panel"><h2>Forward Shadow</h2><div class="kv">'+field('Valid Prediction Days',sh.valid_prediction_days)+field('Pair Status',p.pair_status)+field('Review Count',sh.review_count)+field('Pending Count',sh.pending_count)+'</div></section><section id="charts" class="panel"><h2>技術線圖</h2><div class="loading">技術線圖載入中</div></section>';document.getElementById('integrity').textContent=JSON.stringify(p.integrity||{},null,2);try{const c=await getJson(chartSource);verify(p,c);document.getElementById('charts').innerHTML='<h2>技術線圖</h2>'+chartCard('TXF',c.markets.TXF)+chartCard('ES',c.markets.ES);document.getElementById('integrity').textContent=JSON.stringify({...p.integrity,chart_data_hash:c.chart_data_hash,chart_binding:'PASS'},null,2)}catch(e){document.getElementById('charts').innerHTML='<h2>技術線圖</h2><div class="error">技術線圖暫時無法取得：'+esc(e.message)+'<br><button type="button" onclick="load()">重新載入</button></div>';document.getElementById('integrity').textContent=JSON.stringify({...p.integrity,chart_binding:'FAIL',chart_error:e.message},null,2)}}catch(e){document.getElementById('app').innerHTML='<div class="error">期貨雷達資料暫時無法取得：'+esc(e.message)+'<br><button type="button" onclick="load()">重新載入</button></div>';document.getElementById('integrity').textContent='資料驗證暫不可用'}}
load();
</script></body></html>
