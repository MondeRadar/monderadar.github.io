<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>孟德雷達｜期貨雷達</title><style>
:root{--bg:#0b1220;--card:#121c2e;--line:#2d405d;--text:#e7edf7;--muted:#a8b7cc;--gold:#f6c453;--green:#55d6a5;--red:#ff8a8a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,'Noto Sans TC',sans-serif}main{max-width:1120px;margin:auto;padding:28px 18px 42px}h1,h2{margin:0 0 10px;color:var(--gold)}h1{font-size:clamp(28px,5vw,48px)}p{margin:7px 0;color:var(--muted)}.hero,.card,.panel{border:1px solid var(--line);border-radius:18px;background:var(--card);padding:22px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;margin-top:14px}.label{color:var(--muted)}.value{text-align:right;overflow-wrap:anywhere}.badge{display:inline-block;border-radius:999px;padding:6px 12px;background:#1f334c;color:var(--green);font-weight:700}.warn{color:var(--gold)}details{color:var(--muted)}summary{cursor:pointer;color:var(--gold)}footer{margin-top:26px;color:var(--muted);font-size:13px}.loading,.error,.stale{padding:16px;border-radius:12px;background:#18253a}@media(max-width:700px){main{padding:18px 12px 30px}.grid{grid-template-columns:1fr}.kv{grid-template-columns:1fr}.value{text-align:left}}
</style></head><body><main><section class="hero"><h1>孟德雷達</h1><p>Futures Radar｜期貨雷達</p><p id="radar-date">資料載入中</p><span id="readiness" class="badge">載入中</span><p id="pair-warning" class="warn"></p></section>
<div id="app"><div class="loading">正在讀取正式 Futures Radar 資料…</div></div>
<section class="panel"><h2>資料驗證</h2><details><summary>展開驗證詳情</summary><pre id="integrity"></pre></details></section>
<footer>資料僅供市場研究與資訊整理，不構成投資建議。期貨具高槓桿與高風險，交易前請自行評估風險承受能力。</footer></main>
<script>
const source='futures_radar_presentation.json';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const field=(l,v)=>`<div class="label">${esc(l)}</div><div class="value">${esc(v??'資料累積中')}</div>`;
function card(c){const current=c.is_current;return `<section class="card"><h2>${esc(c.display_name)}</h2><p>${current?'當前正式 R1':'本日無有效新 R1'}｜資料日期：${esc(c.business_date||'—')}</p>${current?`<div class="kv">${field('方向',c.direction)}${field('狀態',c.strategy_status)}${field('Entry',c.entry)}${field('Stop',c.stop)}${field('Target',c.target)}${field('RR',c.rr)}${field('日線支撐',c.daily_support)}${field('日線壓力',c.daily_resistance)}${field('60m 支撐',c.hourly_support)}${field('60m 壓力',c.hourly_resistance)}${field('Review',c.review_status)}${field('資料新鮮度',c.status)}</div>`:`<p class="warn">${esc(c.status==='STALE'?'最新可用資料不是本日 R1，未作為今日訊號展示。':'本日無有效新 R1')}</p>`}<details><summary>Debug / provenance</summary><pre>${esc(JSON.stringify({prediction_id:c.prediction_id,snapshot_hash:c.snapshot_hash,scheduler_evidence:c.scheduler_evidence},null,2))}</pre></details></section>`}
fetch(source).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(d=>{document.getElementById('radar-date').textContent='Radar date：'+(d.radar_date||'—')+'｜最後更新：'+(d.generated_at||'—');document.getElementById('readiness').textContent=d.release_readiness;document.getElementById('pair-warning').textContent=d.pairing.warning||'';document.getElementById('app').innerHTML='<div class="grid">'+['TXF','ES'].map(m=>card(d.markets[m])).join('')+'</div><section class="panel"><h2>Forward Shadow</h2><div class="kv">'+field('Valid Prediction Days',d.forward_shadow.valid_prediction_days??'未提供')+field('Pair Status',d.pair_status)+field('Review Count',d.forward_shadow.review_count)+field('Pending Count',d.forward_shadow.pending_count)+'</div></section>';document.getElementById('integrity').textContent=JSON.stringify(d.integrity,null,2)}).catch(e=>{document.getElementById('app').innerHTML='<div class="error">期貨雷達資料暫時無法取得：'+esc(e.message)+'</div>'});
</script></body></html>
