<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>孟德雷達｜期貨雷達</title>
  <style>
    :root{--bg:#0b1220;--card:#121c2e;--line:#2d405d;--text:#e7edf7;--muted:#a8b7cc;--gold:#f6c453;--green:#55d6a5;--red:#ff8a8a;--blue:#62b0ff;--orange:#ff9f68;--daily:#9db7ff}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,'Noto Sans TC',sans-serif} main{max-width:1180px;margin:auto;padding:28px 18px 42px} h1,h2{margin:0 0 10px;color:var(--gold)} h1{font-size:clamp(28px,5vw,48px)} p{margin:7px 0;color:var(--muted)} .hero,.card,.panel{border:1px solid var(--line);border-radius:18px;background:var(--card);padding:22px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.kv,.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;margin-top:14px}.label,.muted{color:var(--muted)}.value{text-align:right;overflow-wrap:anywhere}.badge{display:inline-block;border-radius:999px;padding:6px 12px;background:#1f334c;color:var(--green);font-weight:700}.warn{color:var(--gold)}.error{padding:16px;border-radius:12px;background:#281d25;color:var(--red);border:1px solid #864b5a}.loading{padding:16px;border-radius:12px;background:#18253a} details{color:var(--muted)} summary{cursor:pointer;color:var(--gold)} button{border:1px solid var(--line);border-radius:8px;background:#1f334c;color:var(--text);padding:8px 12px;cursor:pointer}.badge.pending{background:#3b2d12;color:#ffd77b}.pending-card{border-color:#806128}.pending-card h2{color:#ffd77b}
  </style>
</head>
<body>
  <main>
    <section class="hero">
      <h1>孟德雷達</h1>
      <p>Futures Radar｜期貨雷達</p>
      <p id="radar-date">資料載入中</p>
      <span id="readiness" class="badge">載入中</span>
      <p id="pair-warning" class="warn"></p>
    </section>
    <div id="app"><div class="loading">正在讀取正式 Futures Radar 資料…</div></div>
    <section id="charts" class="panel">
      <h2>技術線圖</h2>
      <div class="loading">技術線圖載入中</div>
    </section>
    <section class="panel">
      <h2>資料驗證</h2>
      <details>
        <summary>展開驗證詳情</summary>
        <pre id="integrity"></pre>
      </details>
    </section>
    <footer>資料僅供市場研究與資訊整理，不構成投資建議。期貨具高槓桿與高風險，交易前請自行評估風險承受能力。</footer>
  </main>
  <script>
    const presentationSource = './futures_radar_presentation.json';
    const chartSource = './futures_radar_chart_data.json';
    const technicalSource = './futures_radar_current_technical_structure.json';
    function esc(value) {
      return String(value ?? '').replace(/[&<>\"\']/g, (char) => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[char]));
    }
    function fmt(value) {
      return Number.isFinite(Number(value)) ? Number(value).toLocaleString('en-US', { maximumFractionDigits: 2 }) : 'N/A';
    }
    function field(label, value) {
      return `<div class="label">${esc(label)}</div><div class="value">${esc(value ?? '資料累積中')}</div>`;
    }
    function taipeiDateFromTimestamp(value) {
      if (!value) return null;
      const date = new Date(value);
      if (!Number.isFinite(date.getTime())) return null;
      const parts = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Taipei', year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(date);
      const map = Object.fromEntries(parts.map((part) => [part.type, part.value]));
      return `${map.year}-${map.month}-${map.day}`;
    }
    function currentPairAssessment(p) {
      const today = taipeiDateFromTimestamp(new Date().toISOString());
      if (!p || p.pair_status !== 'PAIR_COMPLETE') {
        return { current: false, status: 'DATA_PENDING', reason: 'PAIR_INCOMPLETE', today };
      }
      const markets = ['TXF', 'ES'].map((k) => p.markets?.[k]);
      if (markets.some((x) => !x)) {
        return { current: false, status: 'DATA_PENDING', reason: 'MARKET_MISSING', today };
      }
      const dates = markets.map((x) => taipeiDateFromTimestamp(x.analysis_window_start));
      if (dates.some((x) => !x)) {
        return { current: false, status: 'DATA_PENDING', reason: 'CANONICAL_DATE_UNRESOLVED', today };
      }
      if (dates[0] !== dates[1] || dates[0] !== today || p.radar_date !== dates[0] || p.pairing?.canonical_shadow_date !== dates[0]) {
        return { current: false, status: 'DATA_PENDING', reason: 'STALE_OR_MISMATCHED_CANONICAL_DATE', today, dates };
      }
      if (markets.some((x) => !x.snapshot_hash || x.scheduler_evidence?.provenance_confidence !== 'PROVEN' || !x.scheduler_evidence?.execution_id || !x.scheduler_evidence?.attempt_id)) {
        return { current: false, status: 'DATA_PENDING', reason: 'PROVENANCE_OR_HASH_UNRESOLVED', today, dates };
      }
      return { current: true, status: 'CURRENT', reason: null, today, dates };
    }
    async function renderHistoricalCharts(p) {
      const panel = document.getElementById('charts');
      if (!panel) return false;
      try {
        const c = await getJson(chartSource);
        const txfMarket = c?.markets?.TXF;
        const esMarket = c?.markets?.ES;
        const txfValues = Array.isArray(txfMarket?.bars) ? txfMarket.bars.map((bar) => Number(bar.close ?? bar.last ?? bar.value)).filter((value) => Number.isFinite(value)) : [];
        const esValues = Array.isArray(esMarket?.bars) ? esMarket.bars.map((bar) => Number(bar.close ?? bar.last ?? bar.value)).filter((value) => Number.isFinite(value)) : [];
        const makeSvg = (key, values) => {
          const min = values.length ? Math.min(...values) : 0;
          const max = values.length ? Math.max(...values) : 1;
          const spread = max - min || 1;
          const points = values.length ? values.map((value, index) => {
            const x = (index / Math.max(values.length - 1, 1)) * 300;
            const y = 118 - ((value - min) / spread) * 90;
            return `${x.toFixed(1)},${y.toFixed(1)}`;
          }).join(' ') : '0,118 300,118';
          const color = key === 'TXF' ? '#62b0ff' : '#ff9f68';
          const lastY = values.length ? (118 - ((Number(values[values.length - 1]) - min) / spread) * 90).toFixed(1) : 118;
          return `<svg class="chart" viewBox="0 0 300 130" preserveAspectRatio="none" aria-label="${key} historical chart" role="img"><polyline fill="none" stroke="${color}" stroke-width="2" points="${points}"/><circle cx="300" cy="${lastY}" r="3" fill="${color}"/></svg>`;
        };
        const txfCard = chartCard('TXF', txfMarket, 'HISTORICAL / LAST VALID');
        const esCard = chartCard('ES', esMarket, 'HISTORICAL / LAST VALID');
        const txfHtml = txfCard.replace(/<div class="chart-box">/, `<div class="chart-box">${makeSvg('TXF', txfValues)}`);
        const esHtml = esCard.replace(/<div class="chart-box">/, `<div class="chart-box">${makeSvg('ES', esValues)}`);
        panel.innerHTML = '<h2>技術線圖</h2>' + txfHtml + esHtml;
        return true;
      } catch (error) {
        panel.innerHTML = '<h2>技術線圖</h2><div class="error" data-current-state="DATA_PENDING">HISTORICAL / LAST VALID｜保持技術分析區可見，並明示為非當前歷史資料，避免誤將舊圖表當成今日結構。</div>';
        return false;
      }
    }
    function chartCard(key, market, technicalState) {
      const label = key === 'TXF' ? '台指期 TXF' : 'E-mini S&P 500 ES';
      const currentText = technicalState === 'CURRENT_FOR_RADAR_DATE' ? 'CURRENT_FOR_RADAR_DATE' : 'HISTORICAL / LAST VALID';
      const last = Number(market?.bars?.[market.bars.length - 1]?.close ?? 0);
      return `<section class="card"><h2>${esc(label)}｜60m 技術線圖</h2><p class="muted">資料日期：${esc(market?.chart_source_date || '—')}｜技術結構狀態：${esc(currentText)}</p><div class="market-layout"><div class="chart-box"><div class="chart-title"><span>60m Candlestick｜X 軸時間・Y 軸點數</span><span>Last ${esc(fmt(last))}</span></div><div class="error">HISTORICAL / LAST VALID｜技術分析區保持可見，並明示為非當前歷史資料。</div></div><div><div class="metric-grid">${[['Last', last], ['Source date', market?.chart_source_date || '—']].map(([labelName, value]) => `<div class="metric"><small>${esc(labelName)}</small><strong>${esc(fmt(value))}</strong></div>`).join('')}</div></div></div></section>`;
    }
    function card(c) {
      c = c || {};
      const gate = window.__currentPairAssessment || { current: false, status: 'DATA_PENDING', reason: 'PAIR_VALIDATION_NOT_RUN' };
      if (gate.current) {
        return `<section class="card"><h2>${esc(c.display_name || '期貨市場')}</h2><p>${c.is_current ? '當前正式 R1' : '本日無有效新 R1'}｜資料日期：${esc(c.business_date || '—')}</p><div class="kv">${field('Prediction ID', c.prediction_id)}${field('方向', c.direction)}${field('狀態', c.strategy_status)}${field('Entry', c.entry)}${field('Stop', c.stop)}${field('Target', c.target)}${field('RR', c.rr)}${field('Review', c.review_status || '資料累積中')}</div></section>`;
      }
      const latest = c.canonical_shadow_date || c.analysis_window_start || c.business_date || 'CANONICAL_DATE_UNRESOLVED';
      const hist = c.historical_reference || {};
      return `<section class="card pending-card" data-current-state="DATA_PENDING"><h2>${esc(c.display_name || '期貨市場')}</h2><p class="warn">期貨雷達資料更新中｜今日正式 R1 尚未完成</p><p>最新有效資料日期：${esc(latest)}（歷史資料，非當前訊號）</p><p>狀態：${esc(gate.reason || 'DATA_PENDING')}</p><details><summary>歷史紀錄 / provenance</summary><div class="kv">${field('歷史 Prediction ID', hist.prediction_id || c.prediction_id)}${field('Canonical date', hist.canonical_shadow_date || c.canonical_shadow_date)}${field('Snapshot hash', hist.snapshot_hash || c.snapshot_hash)}</div></details></section>`;
    }
    async function getJson(url) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 10000);
      try {
        const response = await fetch(url, { signal: controller.signal, cache: 'no-cache' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        return await response.json();
      } finally {
        clearTimeout(timer);
      }
    }
    async function load() {
      try {
        const p = await getJson(presentationSource);
        if (!p?.radar_date || !p.markets?.TXF || !p.markets?.ES) {
          throw new Error('正式資料 schema 不完整');
        }
        window.__currentPairAssessment = currentPairAssessment(p);
        document.getElementById('radar-date').textContent = 'Radar date：' + p.radar_date + '｜今日預期：' + (window.__currentPairAssessment.today || '—');
        const badge = document.getElementById('readiness');
        badge.textContent = window.__currentPairAssessment.current ? 'READY' : 'DATA_PENDING';
        if (!window.__currentPairAssessment.current) badge.classList.add('pending');
        document.getElementById('pair-warning').textContent = '今日有效 TXF + ES R1 尚未完成同一 canonical date 配對；未使用歷史訊號補位。';
        document.getElementById('app').innerHTML = '<div class="grid">' + ['TXF', 'ES'].map((key) => card(p.markets[key])).join('') + '</div>';
        const charts=document.getElementById('charts');
        if(!window.__currentPairAssessment.current){
          if (charts) {
            await renderHistoricalCharts(p);
          }
          document.getElementById('integrity').textContent = JSON.stringify({
            current_pair_gate: window.__currentPairAssessment,
            pair_status: p.pair_status,
            presentation_date: p.radar_date,
          }, null, 2);
          return;
        }
        if (charts) {
          try {
            const c = await getJson(chartSource);
            const txfState = 'CURRENT_FOR_RADAR_DATE';
            const esState = 'CURRENT_FOR_RADAR_DATE';
            charts.innerHTML = '<h2>技術線圖</h2>' + chartCard('TXF', c?.markets?.TXF, txfState) + chartCard('ES', c?.markets?.ES, esState);
            document.getElementById('integrity').textContent = JSON.stringify({
              current_pair_gate: window.__currentPairAssessment,
              pair_status: p.pair_status,
              chart_data_hash: c?.chart_data_hash || 'pending',
              technical_structure: { TXF: txfState, ES: esState },
            }, null, 2);
          } catch (chartError) {
            charts.innerHTML = '<h2>技術線圖</h2><div class="error">HISTORICAL / LAST VALID｜技術分析區保持可見，並明示為非當前歷史資料。</div>';
            document.getElementById('integrity').textContent = JSON.stringify({ current_pair_gate: window.__currentPairAssessment, pair_status: p.pair_status, chart_error: chartError.message }, null, 2);
          }
        }
      } catch (error) {
        document.getElementById('app').innerHTML = '<div class="error">期貨雷達資料暫時無法取得：' + esc(error.message) + '</div>';
        const charts = document.getElementById('charts');
        if (charts) {
          charts.innerHTML = '<div class="error">資料未驗證，請等待正式技術結構更新。</div>';
        }
        document.getElementById('integrity').textContent = '資料暫時無法取得，請稍後再試。';
      }
    }
    load();
  </script>
</body>
</html>
